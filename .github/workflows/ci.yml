name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- backend
  test-backend:
    name: pytest (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest==8.3.4" \
            "pyjwt==2.10.1" \
            "bcrypt==4.2.1" \
            "google-auth==2.36.0" \
            "requests" \
            "email-validator==2.2.0" \
            "structlog==24.4.0" \
            "fastapi==0.115.6" \
            "pydantic==2.10.4" \
            "httpx==0.28.1" \
            "livekit-api>=1.0.5" \
            "python-multipart==0.0.20"

      - name: Run pytest
        run: pytest tests/ -v --tb=short --color=yes

  # --------------------------------------------------------------- frontend
  test-frontend:
    name: vitest (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install studio deps
        working-directory: apps/studio
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: apps/studio
        run: bun run build

      - name: Run vitest
        working-directory: apps/studio
        run: bun run test

  # --------------------------------------------------------------- deploy
  # Only runs on push to main, AFTER both test jobs are green.
  deploy:
    name: deploy to GH200
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build SPA
        working-directory: apps/studio
        env:
          VITE_API_BASE: https://vaani-api.shubhamiitbhu.in
          VITE_GOOGLE_CLIENT_ID: 546289365103-n34acbu7chavctqf2p15vov4alvdaeq4.apps.googleusercontent.com
          VITE_CASHFREE_MODE: production
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync application code
        run: |
          rsync -az --delete \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='studio/node_modules/' \
            --exclude='studio/dist/' \
            --exclude='studio/.env' \
            --exclude='studio/*.tsbuildinfo' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            apps/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/ubuntu/vaani/apps/"

      - name: Rsync infra
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            infra/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/ubuntu/vaani/infra/"

      - name: Rsync deploy scripts
        run: |
          rsync -az --chmod=Du=rwx,go=rx,Fu=rwx,go=rx \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            scripts/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/ubuntu/vaani/scripts/"

      - name: Rsync built SPA
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            apps/studio/dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/ubuntu/vaani/apps/studio/dist/"

      - name: Run remote deploy script
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /home/ubuntu/vaani/scripts/deploy_remote.sh"

      - name: Smoke test public endpoints
        run: |
          set -e
          curl -fsS https://vaani-api.shubhamiitbhu.in/api/info | grep -q '"ready":true'
          curl -fsSI https://vaani.shubhamiitbhu.in/ | head -1 | grep -q "200"
          echo "smoke ok"
