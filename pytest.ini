[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --color=yes
markers =
    security: security-focused regression test
    edge: edge-case / Codeforces-style tricky input
    integration: full FastAPI route round-trip
    slow: > 1s
filterwarnings =
    ignore::DeprecationWarning
