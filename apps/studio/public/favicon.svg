<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#ff7e27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#0a0a0a" rx="14"/>
  <g fill="url(#g)" filter="url(#glow)">
    <rect x="9"  y="26" width="6" height="12" rx="3"/>
    <rect x="19" y="18" width="6" height="28" rx="3"/>
    <rect x="29" y="10" width="6" height="44" rx="3"/>
    <rect x="39" y="18" width="6" height="28" rx="3"/>
    <rect x="49" y="26" width="6" height="12" rx="3"/>
  </g>
</svg>
